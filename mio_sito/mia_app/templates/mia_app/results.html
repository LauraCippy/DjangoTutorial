{% extends "base.html" %}

{% block title %}Risultato{% endblock %}

{% block content %}

<h1>{{ question.domanda }}</h1>

<ul>
{% for choice in question.choice_set.all %}
    <li>{{ choice.scelta }} -- {{ choice.voti }} vote{{ choice.voti|pluralize }}</li>
{% endfor %}
</ul>

<a href="{% url 'mia_app:detail' question.id %}">Vuoi votare ancora ?</a>

{% endblock %}
